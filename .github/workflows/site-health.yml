name: Site health
on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # The homepage is now the /src rebuild (Vite SPA shell placed at the repo
      # root by scripts/build-src.sh), so the served HTML is a shell — curl sees
      # no rendered section ids. The pre-cutover check grepped for the legacy
      # <script id="ntlsn-journey"> tag, which no longer exists: those doors were
      # folded into StartGrid. Assert the shell AND the entry bundle instead.
      - name: Homepage serves the app shell
        run: curl -sf --compressed https://ntlsn.com/ | grep -q '<div id="root">'
      - name: Entry bundle is reachable and carries the front door
        run: |
          asset=$(curl -sf --compressed https://ntlsn.com/ \
            | grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' | head -1)
          if [ -z "$asset" ]; then
            echo "::error::homepage references no /assets/index-*.js entry bundle"
            exit 1
          fi
          echo "entry bundle: $asset"
          curl -sf --compressed "https://ntlsn.com$asset" | grep -q 'ntlsn-startgrid'
      - name: Legacy homepage is retained as a rollback target
        run: curl -sf -o /dev/null --compressed https://ntlsn.com/legacy.html
      - name: Start Here is itself (not a soft-404)
        run: curl -sf --compressed https://ntlsn.com/start-here.html | grep -q 'Start here'
      - name: ORCID front door is itself
        run: curl -sf --compressed https://ntlsn.com/orcid-start.html | grep -qi 'orcid'
      - name: About page is itself
        run: curl -sf --compressed https://ntlsn.com/about.html | grep -q 'Our Story'
      - name: events.json parses and has a future event
        run: |
          curl -sf https://ntlsn.com/data/events.json -o events.json
          python3 - <<'PY'
          import json,datetime
          d=json.load(open('events.json'))
          evs=d if isinstance(d,list) else d.get('events',[])
          today=datetime.date.today().isoformat()
          assert any(e.get('date','')>=today for e in evs), 'no future events'
          PY
      - name: Real 404s are real
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://ntlsn.com/definitely-not-a-page.html)
          [ "$code" = "404" ]
